server:
  port: 8088

spring:
  application:
    name: chat-service
  config:
    import: optional:configserver:http://config-server:8888
  data:
    mongodb:
      uri: mongodb://chat-db:27017/chat_db

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
