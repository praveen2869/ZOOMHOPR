version: "3.8"

services:
  # ---------- Infra ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  auth-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: auth_db, POSTGRES_USER: auth_user, POSTGRES_PASSWORD: auth_pass}
    volumes: [auth-db-data:/var/lib/postgresql/data]

  user-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: user_db, POSTGRES_USER: user_user, POSTGRES_PASSWORD: user_pass}
    volumes: [user-db-data:/var/lib/postgresql/data]

  vehicle-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: vehicle_db, POSTGRES_USER: vehicle_user, POSTGRES_PASSWORD: vehicle_pass}
    volumes: [vehicle-db-data:/var/lib/postgresql/data]

  booking-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: booking_db, POSTGRES_USER: booking_user, POSTGRES_PASSWORD: booking_pass}
    volumes: [booking-db-data:/var/lib/postgresql/data]

  payment-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: payment_db, POSTGRES_USER: payment_user, POSTGRES_PASSWORD: payment_pass}
    volumes: [payment-db-data:/var/lib/postgresql/data]

  ridematch-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: ridematch_db, POSTGRES_USER: ridematch_user, POSTGRES_PASSWORD: ridematch_pass}
    volumes: [ridematch-db-data:/var/lib/postgresql/data]

  review-db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: review_db, POSTGRES_USER: review_user, POSTGRES_PASSWORD: review_pass}
    volumes: [review-db-data:/var/lib/postgresql/data]

  notification-db:
    image: mongo:7
    volumes: [notification-db-data:/data/db]

  chat-db:
    image: mongo:7
    volumes: [chat-db-data:/data/db]

  # ---------- Platform ----------
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports: ["8761:8761"]

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    depends_on: [eureka-server]
    ports: ["8888:8888"]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on: [eureka-server, config-server]
    ports: ["8080:8080"]

  # ---------- Business services ----------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on: [eureka-server, config-server, auth-db]
    ports: ["8081:8081"]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on: [eureka-server, config-server, user-db]
    ports: ["8084:8084"]

  vehicle-service:
    build:
      context: .
      dockerfile: vehicle-service/Dockerfile
    depends_on: [eureka-server, config-server, vehicle-db, redis]
    ports: ["8082:8082"]

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    depends_on: [eureka-server, config-server, booking-db, kafka, vehicle-service]
    ports: ["8083:8083"]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on: [eureka-server, config-server, payment-db, kafka]
    ports: ["8085:8085"]

  ridematch-service:
    build:
      context: .
      dockerfile: ridematch-service/Dockerfile
    depends_on: [eureka-server, config-server, ridematch-db, redis]
    ports: ["8086:8086"]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on: [eureka-server, config-server, notification-db, kafka]
    ports: ["8087:8087"]

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    depends_on: [eureka-server, config-server, chat-db]
    ports: ["8088:8088"]

  review-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    depends_on: [eureka-server, config-server, review-db]
    ports: ["8089:8089"]

volumes:
  auth-db-data:
  user-db-data:
  vehicle-db-data:
  booking-db-data:
  payment-db-data:
  ridematch-db-data:
  review-db-data:
  notification-db-data:
  chat-db-data:
