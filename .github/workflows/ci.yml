name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & verify backend (Maven)
  # ─────────────────────────────────────────
  backend:
    name: Backend Maven build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomhopr-clone/zoomhopr-clone
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all services (skip tests for speed)
        run: mvn --batch-mode verify -DskipTests

  # ─────────────────────────────────────────
  # JOB 2: Build frontend (Node/Vite)
  # ─────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomhopr-frontend/zoomhopr-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zoomhopr-frontend/zoomhopr-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ─────────────────────────────────────────
  # JOB 3: Deploy frontend to Netlify
  # Runs only on push to main (not PRs)
  # Waits for frontend job to pass
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Netlify
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Netlify deploy hook
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_HOOK_URL }}"
          echo "Netlify deploy triggered!"

  # ─────────────────────────────────────────
  # JOB 4: Deploy backend to Render
  # Runs only on push to main (not PRs)
  # Waits for backend job to pass
  # ─────────────────────────────────────────
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s "${{ secrets.RENDER_HOOK_URL }}"
          echo "Render deploy triggered!"
