name: ZoomHopr CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────
# STAGE 1 — CODE QUALITY  (runs in parallel, ~3-5 min)
# ─────────────────────────────────────────────────────────────────
jobs:

  # ── 1a. Pylint on Python API test scripts ────────────────────
  lint-python:
    name: "Quality · Pylint (Python tests)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Run Pylint on test files
        run: |
          # Run pylint and capture its native exit code.
          # Pylint exit code is a BITMASK — any issue = non-zero:
          #   0  = no issues at all
          #   1  = fatal message
          #   2  = error message
          #   4  = warning message
          #   8  = refactor message (e.g. R0801 duplicate-code)
          #  16  = convention message (e.g. C0116 missing-docstring)
          #  32  = usage error
          # Values are ORed — so C0116+R0801 = 16+8 = exit code 24

          set +e   # don't auto-exit so we can capture the code
          pylint tests/ \
            --rcfile=tests/.pylintrc \
            --output-format=colorized \
            --score=yes \
            --msg-template="{path}:{line}: [{msg_id}({symbol})] {msg}" \
            2>&1 | tee pylint-report.txt
          PYLINT_EXIT=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Pylint exit code: $PYLINT_EXIT"

          # Decode what the exit code means
          if   [ $((PYLINT_EXIT & 1))  -ne 0 ]; then echo "  ❌ FATAL messages found"; fi
          if   [ $((PYLINT_EXIT & 2))  -ne 0 ]; then echo "  ❌ ERROR messages found"; fi
          if   [ $((PYLINT_EXIT & 4))  -ne 0 ]; then echo "  ⚠️  WARNING messages found"; fi
          if   [ $((PYLINT_EXIT & 8))  -ne 0 ]; then echo "  🔁 REFACTOR messages found (e.g. duplicate code)"; fi
          if   [ $((PYLINT_EXIT & 16)) -ne 0 ]; then echo "  📝 CONVENTION messages found (e.g. missing docstring)"; fi
          if   [ $((PYLINT_EXIT & 32)) -ne 0 ]; then echo "  🚨 USAGE ERROR"; fi

          if [ $PYLINT_EXIT -eq 0 ]; then
            echo "  ✅ Pylint: ZERO issues found — pipeline continues"
          else
            echo "  ❌ Pylint found issues (exit $PYLINT_EXIT) — BLOCKING pipeline"
            echo "     Fix all warnings/conventions above, then re-push."
            exit $PYLINT_EXIT
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        continue-on-error: false

      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt
          retention-days: 7

  # ── 1b. Frontend dependency audit ────────────────────────────
  lint-frontend:
    name: "Quality · Frontend Audit (npm)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomhopr-frontend/zoomhopr-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zoomhopr-frontend/zoomhopr-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Run npm audit (moderate+)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Verify build still works after audit
        run: npm run build

  # ── 1c. Backend dependency vulnerability scan (OWASP) ────────
  lint-backend:
    name: "Quality · OWASP Dependency Check (Java)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomhopr-clone/zoomhopr-clone
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        run: |
          mvn --batch-mode \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DskipTests \
            -Dformats=HTML,JSON \
            -DsuppressionFile="" \
            --no-transfer-progress
        continue-on-error: true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: zoomhopr-clone/zoomhopr-clone/**/dependency-check-report.*
          retention-days: 14

# ─────────────────────────────────────────────────────────────────
# STAGE 2 — BUILD  (parallel, ~8-10 min — Maven is the bottleneck)
# ─────────────────────────────────────────────────────────────────

  # ── 2a. Maven multi-module build ─────────────────────────────
  build-backend:
    name: "Build · Spring Boot (Maven)"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: zoomhopr-clone/zoomhopr-clone
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build all microservices
        id: maven-build
        run: mvn --batch-mode verify -DskipTests --no-transfer-progress

      - name: Backend build status summary
        if: always()
        run: |
          echo "## 🔧 Backend Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | JAR | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          SERVICES="eureka-server config-server api-gateway auth-service user-service vehicle-service booking-service payment-service ridematch-service notification-service chat-service review-service"
          for svc in $SERVICES; do
            JAR=$(find . -path "*/$svc/target/*.jar" -not -name "*-sources.jar" 2>/dev/null | head -1)
            if [ -n "$JAR" ]; then
              SIZE=$(du -sh "$JAR" | cut -f1)
              echo "| \`$svc\` | \`$(basename $JAR)\` ($SIZE) | ✅ Built |"
            else
              echo "| \`$svc\` | — | ❌ Missing |"
            fi
          done >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.maven-build.outcome }}" = "success" ]; then
            echo "**Result: ✅ All microservices compiled successfully**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result: ❌ Build failed — check Maven logs above**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts (JARs)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: zoomhopr-clone/zoomhopr-clone/**/target/*.jar
          retention-days: 1

  # ── 2b. Vite frontend build ───────────────────────────────────
  build-frontend:
    name: "Build · React/Vite (Node)"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: zoomhopr-frontend/zoomhopr-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zoomhopr-frontend/zoomhopr-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        id: vite-build
        run: npm run build

      - name: Frontend build status summary
        if: always()
        run: |
          echo "## 🌐 Frontend Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | React + Vite |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Version | $(node --version) |" >> $GITHUB_STEP_SUMMARY
          echo "| npm Version | $(npm --version) |" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            DIST_SIZE=$(du -sh dist | cut -f1)
            FILE_COUNT=$(find dist -type f | wc -l)
            JS_SIZE=$(find dist -name '*.js' -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1)
            CSS_SIZE=$(find dist -name '*.css' -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1)
            echo "| Output Dir | \`dist/\` ($DIST_SIZE total) |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Files | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| JS Bundle | $JS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| CSS Bundle | $CSS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Build Result | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Result | ❌ Failed — dist/ not found |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zoomhopr-frontend/zoomhopr-frontend/dist/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────
# STAGE 2b — DATABASE HEALTH CHECK  (parallel with build, ~2-3 min)
# Spins up all 9 DB service containers and verifies connectivity
# ─────────────────────────────────────────────────────────────────

  database-check:
    name: "Infrastructure · Database Health Check"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      # ── Auth DB ───────────────────────────────────────────────
      auth-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
        ports: ["5432:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── User DB ───────────────────────────────────────────────
      user-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: user_db
          POSTGRES_USER: user_user
          POSTGRES_PASSWORD: user_pass
        ports: ["5433:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Vehicle DB ────────────────────────────────────────────
      vehicle-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vehicle_db
          POSTGRES_USER: vehicle_user
          POSTGRES_PASSWORD: vehicle_pass
        ports: ["5434:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Booking DB ────────────────────────────────────────────
      booking-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_db
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: booking_pass
        ports: ["5435:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Payment DB ────────────────────────────────────────────
      payment-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_pass
        ports: ["5436:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── RideMatch DB ──────────────────────────────────────────
      ridematch-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridematch_db
          POSTGRES_USER: ridematch_user
          POSTGRES_PASSWORD: ridematch_pass
        ports: ["5437:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Review DB ─────────────────────────────────────────────
      review-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: review_db
          POSTGRES_USER: review_user
          POSTGRES_PASSWORD: review_pass
        ports: ["5438:5432"]
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Notification DB (MongoDB) ──────────────────────────────
      notification-db:
        image: mongo:7
        ports: ["27017:27017"]
        options: >
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Chat DB (MongoDB) ─────────────────────────────────────
      chat-db:
        image: mongo:7
        ports: ["27018:27017"]
        options: >
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Redis (Cache) ─────────────────────────────────────────
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Verify all PostgreSQL databases
        run: |
          declare -A PG_DBS=(
            ["auth_db"]="auth_user:auth_pass:5432"
            ["user_db"]="user_user:user_pass:5433"
            ["vehicle_db"]="vehicle_user:vehicle_pass:5434"
            ["booking_db"]="booking_user:booking_pass:5435"
            ["payment_db"]="payment_user:payment_pass:5436"
            ["ridematch_db"]="ridematch_user:ridematch_pass:5437"
            ["review_db"]="review_user:review_pass:5438"
          )
          for db in "${!PG_DBS[@]}"; do
            IFS=':' read -r user pass port <<< "${PG_DBS[$db]}"
            PGPASSWORD=$pass psql -h localhost -p $port -U $user -d $db \
              -c "SELECT current_database(), version();"
            echo "  ✅ $db is UP on port $port"
          done

      - name: Verify MongoDB (notification-db)
        run: |
          mongosh --host localhost --port 27017 \
            --eval "db.runCommand({ping:1})"
          echo "  ✅ notification-db (MongoDB) is UP on port 27017"

      - name: Verify MongoDB (chat-db)
        run: |
          mongosh --host localhost --port 27018 \
            --eval "db.runCommand({ping:1})"
          echo "  ✅ chat-db (MongoDB) is UP on port 27018"

      - name: Verify Redis
        run: |
          redis-cli -h localhost -p 6379 ping
          redis-cli -h localhost -p 6379 info server | grep redis_version
          echo "  ✅ Redis is UP on port 6379"

      - name: Write database health summary
        if: always()
        run: |
          echo "## 🗄️ Database Health Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Database | Engine | Port | Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| auth-db | PostgreSQL 16 | 5432 | auth-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| user-db | PostgreSQL 16 | 5433 | user-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| vehicle-db | PostgreSQL 16 | 5434 | vehicle-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| booking-db | PostgreSQL 16 | 5435 | booking-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| payment-db | PostgreSQL 16 | 5436 | payment-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| ridematch-db | PostgreSQL 16 | 5437 | ridematch-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| review-db | PostgreSQL 16 | 5438 | review-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| notification-db | MongoDB 7 | 27017 | notification-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| chat-db | MongoDB 7 | 27018 | chat-service | ✅ UP |" >> $GITHUB_STEP_SUMMARY
          echo "| redis | Redis 7 | 6379 | vehicle/ridematch cache | ✅ UP |" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────
# STAGE 3 — API TESTS  (~3-5 min)
# Runs after builds pass; uses mocked HTTP (no live server needed)
# ─────────────────────────────────────────────────────────────────

  api-tests:
    # also waits for database-check so DB status is visible before tests run
    name: "Test · Python API Tests (pytest)"
    runs-on: ubuntu-latest
    needs: [lint-python, build-backend, build-frontend, database-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --verbose \
            --tb=short \
            --timeout=30 \
            --cov=tests \
            --cov-report=term-missing \
            --cov-report=html:coverage-html \
            --cov-report=xml:coverage.xml \
            --html=test-report.html \
            --self-contained-html \
            -x

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            test-report.html
            coverage-html/
            coverage.xml
          retention-days: 7

      - name: Print test summary to GitHub Job Summary
        if: always()
        run: |
          echo "## API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY || true

# ─────────────────────────────────────────────────────────────────
# STAGE 4 — SECURITY SCAN  (~3-5 min, parallel with API tests)
# ─────────────────────────────────────────────────────────────────

  security-scan:
    name: "Security · Trivy Container Scan"
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (to build one Docker image for scanning)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build eureka-server Docker image
        run: |
          docker build \
            -f zoomhopr-clone/zoomhopr-clone/eureka-server/Dockerfile \
            -t zoomhopr/eureka-server:${{ github.sha }} \
            zoomhopr-clone/zoomhopr-clone/
        working-directory: .

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Scan Docker image for vulnerabilities
        run: |
          trivy image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            zoomhopr/eureka-server:${{ github.sha }}
          cat trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 14

      - name: Add security summary to GitHub Job Summary
        if: always()
        run: |
          echo "## Security Scan Results (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────
# STAGE 5 — DEPLOY  (only on push to main, all gates must pass)
# ─────────────────────────────────────────────────────────────────

  deploy-frontend:
    name: "Deploy · Frontend → Netlify"
    runs-on: ubuntu-latest
    needs: [api-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Netlify deploy hook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.NETLIFY_HOOK_URL }}")
          echo "Netlify response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "201" ]; then
            echo "Netlify deploy hook failed with code $RESPONSE"
            exit 1
          fi
          echo "Frontend deployed to Netlify successfully!"

      - name: Add deploy summary
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend triggered on **Netlify**" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    name: "Deploy · Backend → Render"
    runs-on: ubuntu-latest
    needs: [api-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_HOOK_URL }}")
          echo "Render response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "201" ]; then
            echo "Render deploy hook failed with code $RESPONSE"
            exit 1
          fi
          echo "Backend deployed to Render successfully!"

      - name: Add deploy summary
        run: |
          echo "✅ Backend triggered on **Render**" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────
# STAGE 6 — PIPELINE SUMMARY  (runs last, always)
# Writes a full status table visible in the GitHub Actions UI
# ─────────────────────────────────────────────────────────────────

  pipeline-summary:
    name: "📋 Pipeline Summary Report"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-python
      - lint-frontend
      - lint-backend
      - build-backend
      - build-frontend
      - database-check
      - api-tests
      - security-scan
    steps:
      - name: Write full pipeline summary
        run: |
          echo "# 🚀 ZoomHopr CI/CD Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Stage Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          # Helper to map outcome to emoji
          status() {
            case "$1" in
              success)  echo "✅ Passed" ;;
              failure)  echo "❌ Failed" ;;
              skipped)  echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *)        echo "⚠️ Unknown" ;;
            esac
          }

          echo "| 1 · Code Quality | Pylint (Python) | $(status '${{ needs.lint-python.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 · Code Quality | npm audit (Frontend) | $(status '${{ needs.lint-frontend.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 · Code Quality | OWASP Dep Check (Java) | $(status '${{ needs.lint-backend.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 · Build | Spring Boot Maven Build | $(status '${{ needs.build-backend.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 · Build | React/Vite Frontend Build | $(status '${{ needs.build-frontend.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 · Infrastructure | Database Health Check (10 DBs) | $(status '${{ needs.database-check.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 · Testing | Python API Tests (pytest) | $(status '${{ needs.api-tests.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 · Security | Trivy Container Scan | $(status '${{ needs.security-scan.result }}') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall result
          CRITICAL_JOBS="${{ needs.build-backend.result }} ${{ needs.build-frontend.result }} ${{ needs.api-tests.result }}"
          if echo "$CRITICAL_JOBS" | grep -q "failure"; then
            echo "## ❌ Pipeline FAILED" >> $GITHUB_STEP_SUMMARY
            echo "One or more critical stages failed. Check the job logs above." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Pipeline PASSED" >> $GITHUB_STEP_SUMMARY
            echo "All critical stages completed successfully." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- \`pylint-report\` — Python code quality score" >> $GITHUB_STEP_SUMMARY
          echo "- \`owasp-dependency-report\` — Java CVE vulnerability report" >> $GITHUB_STEP_SUMMARY
          echo "- \`backend-jars\` — Compiled Spring Boot JARs (12 services)" >> $GITHUB_STEP_SUMMARY
          echo "- \`frontend-dist\` — Production React bundle (dist/)" >> $GITHUB_STEP_SUMMARY
          echo "- \`api-test-report\` — pytest HTML report + coverage" >> $GITHUB_STEP_SUMMARY
          echo "- \`trivy-security-report\` — Docker image CVE scan" >> $GITHUB_STEP_SUMMARY
